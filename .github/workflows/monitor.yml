name: Twitter Monitor Test

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test DingTalk
        env:
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
        run: |
          python -c '
import os
import requests
import json
from datetime import datetime

webhook = os.environ.get("DING_WEBHOOK")
if not webhook:
    print("❌ DING_WEBHOOK 未设置")
    exit(1)

print("✅ Webhook 已读取")

test_msg = f"【测试推送】\n时间: {datetime.now()}\nGitHub Actions 正常运行"

data = {
    "msgtype": "text",
    "text": {"content": test_msg}
}

r = requests.post(webhook, json=data)
print("状态码:", r.status_code)
print("返回:", r.text)
if r.status_code == 200:
    print("✅ 钉钉测试推送成功！")
else:
    print("❌ 推送失败")
          '
