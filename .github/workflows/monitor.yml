name: Twitter Multi-Monitor

on:
  schedule:
    # 改为每 1 分钟自动运行一次
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  check-twitter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run monitoring script
        env:
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
        run: |
          python -c '
          import os
          import feedparser
          import requests
          import json

          ding_webhook = os.environ.get("DING_WEBHOOK")
          if not ding_webhook:
              print("Error: DING_WEBHOOK not set")
              exit(1)

          # 读取监控用户名单
          if not os.path.exists("users.txt"):
              print("Error: users.txt not found")
              exit(1)
              
          with open("users.txt", "r") as f:
              users = [line.strip() for line in f if line.strip() and not line.startswith("#")]

          # 读取历史已发送过的信息记录（防重复）
          history_file = "sent_history.txt"
          sent_ids = set()
          if os.path.exists(history_file):
              with open(history_file, "r") as f:
                  sent_ids = set(f.read().splitlines())

          new_sent_ids = list(sent_ids)
          has_new_msg = False

          # 依次遍历每个用户（使用稳定的公共 RSSHub 节点）
          for username in users:
              rss_url = f"https://rsshub.rssforever.com/twitter/user/{username}/with_replies"
              feed = feedparser.parse(rss_url)

              # 倒序检查最近几条动态
              for entry in reversed(feed.entries[:3]):
                  entry_id = entry.get("id") or entry.get("link")
                  if entry_id in sent_ids:
                      continue
                  
                  title = entry.get("title", "新推文/回复")
                  link = entry.get("link", "")
                  
                  # 必须带上安全关键词 DT，否则钉钉会拦截
                  content = f"【DT 推特监控】\n账号: @{username}\n内容: {title}\n链接: {link}"

                  # 发送到钉钉
                  headers = {"Content-Type": "application/json"}
                  data = {"msgtype": "text", "text": {"content": content}}
                  response = requests.post(ding_webhook, data=json.dumps(data), headers=headers)
                  
                  if response.status_code == 200:
                      print(f"Successfully sent for @{username}")
                  else:
                      print(f"Failed to send for @{username}: {response.text}")

                  new_sent_ids.append(entry_id)
                  has_new_msg = True

          # 保存历史记录（最多保留最近500条）
          with open(history_file, "w") as f:
              f.write("\n".join(new_sent_ids[-500:]))
          '

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent history" && git push)
